name: Bug report
description: Report a reproducible problem in rn-fabricator.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a bug. Please include enough detail to reproduce the issue."
  - type: input
    id: version
    attributes:
      label: Version
      description: rn-fabricator version or commit SHA.
      placeholder: "0.0.0 or commit SHA"
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide commands and relevant environment details.
      placeholder: |
        1. Run ...
        2. See ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, .NET SDK, Node.js, npm, React Native CLI, Xcode, Android SDK.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant CLI output.
      render: shell
